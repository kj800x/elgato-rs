[package]
name = "elgato-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
maud = { version = "0.27", features = ["axum"] }
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
